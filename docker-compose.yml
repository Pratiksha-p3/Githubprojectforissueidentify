# Local dev/staging substitute for real cloud infrastructure (see the
# rewrite plan's "infra substitutions" section). chroma is still a Stage 6
# stub; redis and postgres are real as of Stage 4 (Celery broker/backend,
# idempotency store, and DLQ all run against redis here).
#
# Bring the infra up with `docker compose up`, then run the app processes
# from the venv (see README.md): the API (uvicorn) and worker (celery) are
# not containerized yet — that's Stage 14's deployment-hardening scope.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_code_review
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  chroma_data:
