[project]
name = "ai-code-review"
version = "0.1.0"
description = "AI-powered code review & DevSecOps automation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "celery>=5.4",
    "redis>=5.0",
    "chromadb>=0.5",
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "groq>=0.9",
    "openai>=1.35",
    "anthropic>=0.30",
]

[project.scripts]
review-cli = "src.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "fakeredis>=2.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
